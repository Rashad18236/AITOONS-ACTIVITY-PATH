<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flight Path Poster</title>
<style>
  body { font: 14px system-ui; margin: 0; display: flex; height: 100vh; }
  #panel { width: 300px; padding: 16px; overflow-y: auto; background: #f4f4f4; }
  #panel label { display: block; margin: 10px 0 2px; color: #444; }
  #panel input { width: 100%; box-sizing: border-box; }
  #view { flex: 1; }
  #view canvas { display: block; }
  button { margin-top: 14px; width: 100%; padding: 8px; }
  a.dl { display: block; margin-top: 8px; }
  #status { margin-top: 10px; color: #a00; white-space: pre-wrap; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="panel">
  <h3>Flight Path Poster</h3>
  <label>FR24 track (KML/CSV)</label><input type="file" id="file" accept=".kml,.csv">
  <label>Text (bottom frame bar)</label><input id="text" placeholder="ZURICH → GENEVA">
  <label>Second line (smaller)</label><input id="text2" placeholder="HB-EZE · 12.07.2026">
  <label>Poster size</label><select id="size_mm">
    <option value="216">Large — 21.6 cm</option>
    <option value="170">Medium — 17 cm</option>
    <option value="120">Small — 12 cm</option>
  </select>
  <div id="dims" style="font-size:11px;margin:3px 0;color:#444"></div>
  <label>Max relief mm</label><input id="relief_mm" type="number" placeholder="auto">
  <label>Vertical exaggeration</label><input id="exaggeration" type="number" step="0.1" value="1.5">
  <label>Margin %</label><input id="margin_pct" type="number" value="15">
  <label>Path slot width mm</label><input id="groove_w_mm" type="number" step="0.1" placeholder="auto">
  <label>Grey caps above [m]</label><input id="snow_line_m" type="number" step="100" value="2000">
  <label>Layer height mm</label><input id="layer_mm" type="number" step="0.02" value="0.24">
  <label><input type="checkbox" id="snap_runways" checked style="width:auto">
    Snap takeoff/landing to the runway</label>
  <label>Takeoff runway</label><input id="takeoff_rwy" placeholder="auto — e.g. EGNH 10">
  <label>Landing runway</label><input id="landing_rwy" placeholder="auto — e.g. EGNH 10">
  <p style="font-size:11px;opacity:.7;margin:4px 0">"auto" fields scale with the poster
  size (12mm frame / 20mm relief / 2mm slot at 250mm), floored so they still print.</p>
  <button id="go">Generate</button>
  <div id="status"></div>
  <a class="dl" id="dlFrame" style="display:none">Download frame.3mf</a>
  <a class="dl" id="dlRelief" style="display:none">Download relief.3mf</a>
  <a class="dl" id="dlPath" style="display:none">Download path.3mf</a>
</div>
<div id="view"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ThreeMFLoader } from 'three/addons/loaders/3MFLoader.js';

const view = document.getElementById('view');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdddddd);
const camera = new THREE.PerspectiveCamera(45, 1, 1, 5000);
camera.position.set(200, -250, 250);
camera.up.set(0, 0, 1);
const renderer = new THREE.WebGLRenderer({ antialias: true });
view.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.2));
const dir = new THREE.DirectionalLight(0xffffff, 1.5);
dir.position.set(1, -1, 2);
scene.add(dir);
function resize() {
  camera.aspect = view.clientWidth / view.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(view.clientWidth, view.clientHeight);
}
window.addEventListener('resize', resize); resize();
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

// poster.COLORS, by 3MF body name. Order is the fallback if 3MFLoader drops the names.
const COLORS = { frame: 0x222222, text: 0xffffff,
                 terrain: 0x4caf50, water: 0x2196f3, snow: 0x9e9e9e, roads: 0x9e9e9e };
const RELIEF_ORDER = [0x4caf50, 0x2196f3, 0x9e9e9e, 0x9e9e9e];
const FRAME_ORDER = [0x222222, 0xffffff];
const STRIP_COLOR = 0xcc2222;

let objects = [];
function b64bytes(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }
function place(obj, at) { obj.position.set(...at); objects.push(obj); scene.add(obj); return obj; }

function threeMFGroup(bytes, order) {
  const group = new ThreeMFLoader().parse(bytes.buffer);
  // The loader applies the build item's bed placement to each item object; the
  // preview co-registers the three files in their shared local frame instead.
  group.children.forEach(c => c.position.set(0, 0, 0));
  let i = 0;
  group.traverse(o => {
    if (!o.isMesh) return;
    o.geometry.computeVertexNormals();
    // 3MF displaycolor survives some loader versions and not others — force it.
    o.material = new THREE.MeshStandardMaterial(
      { color: COLORS[o.name] ?? order[i] ?? 0xcccccc });
    i++;
  });
  return group;
}
function clearScene() {
  for (const o of objects) {
    o.traverse(c => { if (c.isMesh) { c.geometry.dispose(); c.material.dispose(); } });
    scene.remove(o);
  }
  objects = [];
}
function dl(el, bytes, name, type) {
  if (el.href) URL.revokeObjectURL(el.href);
  el.href = URL.createObjectURL(new Blob([bytes], { type }));
  el.download = name; el.style.display = 'block';
}

// Live frame size. A caption hangs a chin below the square, so the poster is taller
// than size_mm and can run off the plate while the width still looks fine — the
// server does the sum because the chin comes out of resolve(), not out of arithmetic.
const dims = document.getElementById('dims');
let dimsTimer;
async function refreshDims() {
  const q = new URLSearchParams(['size_mm', 'text', 'text2'].map(
    id => [id, document.getElementById(id).value]));
  try {
    const d = await (await fetch('/dimensions?' + q)).json();
    // "fits" is the printable budget (plate less brim and prime tower), not the bare
    // 256 plate — a frame can sit inside 256 and still refuse to slice.
    dims.textContent = `Frame: ${d.width.toFixed(1)} × ${d.height.toFixed(1)} mm  ·  `
      + (d.fits ? 'fits, brim and prime tower included'
                : `— too big to PRINT (max ${d.max_size_mm}mm at this caption)`);
    dims.style.color = d.fits ? '#444' : '#a00';
  } catch (e) { dims.textContent = ''; }   // blank/garbage size field: say nothing
}
for (const id of ['size_mm', 'text', 'text2'])
  document.getElementById(id).addEventListener('input', () => {
    clearTimeout(dimsTimer); dimsTimer = setTimeout(refreshDims, 300);
  });
refreshDims();   // show the height before any typing — the chin appears with the caption

// Snapping off: grey out the runway overrides so a typed runway can't be silently ignored.
document.getElementById('snap_runways').addEventListener('change', e => {
  for (const id of ['takeoff_rwy', 'landing_rwy'])
    document.getElementById(id).disabled = !e.target.checked;
});

document.getElementById('go').onclick = async () => {
  const f = document.getElementById('file').files[0];
  const status = document.getElementById('status');
  if (!f) { status.textContent = 'Pick a KML/CSV file first.'; return; }
  status.textContent = 'Generating… (terrain download + meshing, ~10-30s)';
  const params = { text: document.getElementById('text').value,
                   text2: document.getElementById('text2').value,
                   snap_runways: document.getElementById('snap_runways').checked,
                   takeoff_rwy: document.getElementById('takeoff_rwy').value,
                   landing_rwy: document.getElementById('landing_rwy').value };
  for (const id of ['size_mm','relief_mm','exaggeration','margin_pct','groove_w_mm',
                    'snow_line_m','layer_mm']) {
    const v = parseFloat(document.getElementById(id).value);
    if (!isNaN(v)) params[id] = v;   // blank field -> server default
  }
  const fd = new FormData();
  fd.append('file', f);
  fd.append('params', JSON.stringify(params));
  try {
    const r = await fetch('/generate', { method: 'POST', body: fd });
    if (!r.ok) { status.textContent = 'Error: ' + JSON.stringify((await r.json()).detail); return; }
    const j = await r.json();
    status.textContent = 'Decoding meshes…';
    clearScene();
    const fb = b64bytes(j.frame), rb = b64bytes(j.relief), sb = b64bytes(j.path);
    // relief plate and strip are meshed in plate-local coords: lift them onto the
    // backplate and inset by the ring plus the fit gap (rounded up to a pixel, as _grid does).
    // In y the chin has pushed the frame's origin down by chin_mm, so the opening
    // — and everything that drops into it — is that much higher up.
    const R = j.resolved;   // server-resolved params: blank "auto" fields already filled in
    const fitCeil = Math.ceil(R.fit_mm / R.res_mm) * R.res_mm;
    const inset = R.frame_mm + fitCeil;
    const at = [inset, inset + R.chin_mm, R.base_mm];
    const frame = place(threeMFGroup(fb, FRAME_ORDER), [0, 0, 0]);
    place(threeMFGroup(rb, RELIEF_ORDER), at);
    place(threeMFGroup(sb, [STRIP_COLOR]), at);
    new THREE.Box3().setFromObject(frame).getCenter(controls.target);
    dl(document.getElementById('dlFrame'), fb, 'frame.3mf', 'model/3mf');
    dl(document.getElementById('dlRelief'), rb, 'relief.3mf', 'model/3mf');
    dl(document.getElementById('dlPath'), sb, 'path.3mf', 'model/3mf');
    status.textContent = 'Done. Three ready-to-print OrcaSlicer projects (Bambu A1, 0.4 nozzle): '
      + 'frame.3mf black + white text on AMS slots 1/2, relief.3mf green/blue/grey on 1/2/3, '
      + 'path.3mf red on its own. Open, slice, print.'
      + (j.runways ? '\n' + j.runways : '');
  } catch (e) {
    status.textContent = 'Request failed: ' + e;
  }
};
</script>
</body>
</html>
